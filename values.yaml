# Default values for eso-localstack
# This file allows you to enable/disable components for step-by-step installation

# Step 1: LocalStack installation
localstack:
  enabled: false
  startServices: "secretsmanager,s3"
  service:
    type: NodePort

# Step 2: External Secrets Operator installation
externalSecrets:
  enabled: false

# External Secrets subchart configuration
external-secrets:
  installCRDs: true
  extraEnv:
    - name: AWS_ENDPOINT_URL
      value: "http://my-eso-localstack.default.svc.cluster.local:4566"

# Step 3: LocalStack credentials (required before SecretStore)
credentials:
  enabled: false
  accessKeyId: test
  secretAccessKey: test

# Step 4: SecretStore configuration
secretStore:
  enabled: false
  name: localstack-secretstore
  region: eu-central-1
  credentialsSecretName: localstack-credentials
  maxRetries: 5
  retryInterval: 10s

# Step 5: ExternalSecret (optional, for testing)
externalSecret:
  enabled: false
  name: app-secret
  refreshInterval: 1m
  secretStoreRef: localstack-secretstore
  targetSecretName: my-app-credentials
  sourceSecretKey: my-app-secret
