{{- if .Values.externalSecrets.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-patch-eso
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "eso-localstack.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      name: {{ .Release.Name }}-patch-eso
    spec:
      serviceAccountName: {{ .Release.Name }}-patch-sa
      restartPolicy: Never
      containers:
      - name: patch
        image: bitnami/kubectl:latest
        command:
        - /bin/sh
        - -c
        - |
          kubectl patch deployment {{ .Release.Name }}-external-secrets \
            -n {{ .Release.Namespace }} \
            --type=json \
            -p='[{"op":"add","path":"/spec/template/spec/containers/0/env/-","value":{"name":"AWS_ENDPOINT_URL","value":"http://{{ .Release.Name }}.{{ .Release.Namespace }}.svc.cluster.local:4566"}}]' || \
          kubectl set env deployment/{{ .Release.Name }}-external-secrets \
            -n {{ .Release.Namespace }} \
            AWS_ENDPOINT_URL=http://{{ .Release.Name }}.{{ .Release.Namespace }}.svc.cluster.local:4566
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-patch-sa
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "eso-localstack.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-patch-role
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "eso-localstack.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-patch-rolebinding
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "eso-localstack.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-patch-role
subjects:
- kind: ServiceAccount
  name: {{ .Release.Name }}-patch-sa
  namespace: {{ .Release.Namespace }}
{{- end }}
