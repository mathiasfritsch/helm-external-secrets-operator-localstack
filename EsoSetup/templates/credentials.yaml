{{- if .Values.credentials.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secretStore.credentialsSecretName | default "localstack-credentials" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "eso-localstack.labels" . | nindent 4 }}
type: Opaque
stringData:
  access-key-id: {{ .Values.credentials.accessKeyId | quote }}
  secret-access-key: {{ .Values.credentials.secretAccessKey | quote }}
{{- end }}
